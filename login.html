<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Sign In — E-Shop Demo</title>
    <meta name="description" content="Sign in to your E-Shop Demo account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
    (function () {
        try {
            if (localStorage.getItem('eshop_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            var C = null;
            try { C = JSON.parse(localStorage.getItem('eshop_site_colors') || 'null'); } catch (e) {}
            if (C) {
                var props = { bg: '--bg', card: '--card-bg', secondary: '--secondary-bg', text: '--text', textSecondary: '--text-secondary', border: '--border', accent: '--accent', headerBg: '--header-bg', headerText: '--header-text' };
                if (C.preset && C.preset !== 'custom') document.documentElement.setAttribute('data-chrome', C.preset);
                else if (C.colors) for (var k in props) { if (C.colors[k]) document.documentElement.style.setProperty(props[k], C.colors[k]); }
            }
            var H = null;
            try { H = JSON.parse(localStorage.getItem('eshop_header_footer_colors') || 'null'); } catch (e) {}
            if (H) {
                if (H.light) document.documentElement.style.setProperty('--hf-bg-light', H.light);
                if (H.dark) document.documentElement.style.setProperty('--hf-bg-dark', H.dark);
            }
        } catch (e) {}
    })();
    </script>
    <style>
    :root { --bg:#f1f3f5; --text:#181b20; }
    :root[data-theme="dark"] { --bg:#0f1115; --text:#e8eaee; }
    :root[data-chrome="light"] { --bg:#ffffff; --text:#14171c; }
    :root[data-chrome="light"][data-theme="dark"] { --bg:#101014; --text:#eceef1; }
    :root[data-chrome="dark"] { --bg:#0f1115; --text:#e8eaee; }
    html, body { background-color:var(--bg,#0f1115); color:var(--text,#e8eaee); }
    </style>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" media="all" />
    <link rel="stylesheet" href="css/components.css" media="all" />
    <link rel="stylesheet" href="css/pages.css" media="all" />
    <link rel="stylesheet" href="css/responsive.css" media="all" />
    <link rel="stylesheet" href="css/demo-contact.css" />
    <noscript>
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/pages.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </noscript>
</head>
<body>
    <header class="header" style="position: relative;">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="E-Shop Demo Home">
                <img class="logo-img" src="assets/logo.svg" alt="E-Shop Demo" />
            </a>
            <div class="header-actions">
                <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg></button>
                <a class="icon-btn account-btn" data-account-link href="login.html" aria-label="Account">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </a>
                <a href="index.html" style="color:var(--header-text); font-weight:500;">Shop</a>
            </div>
        </div>
    </header>

    <main class="checkout-page" style="min-height:60vh;">
        <div class="checkout-container">
            <div class="back-to-shop"><a href="index.html"><img class="back-to-shop-arrow" src="assets/logos/back-arrow.svg" alt=""> Back to Shop</a></div>
            <div class="auth-overlay open" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle" aria-describedby="authSubtitle">
                <div class="auth-dialog">
                    <button class="auth-close" id="authModalClose" type="button" aria-label="Close sign in dialog">✕</button>
                    <div class="auth-head">
                        <h1 class="auth-title" id="authTitle">Welcome back</h1>
                        <p class="auth-subtitle" id="authSubtitle">Sign in to access your account.</p>
                    </div>
                    <button class="auth-google-btn" id="authGoogleBtn" type="button" aria-label="Continue with Google"><span class="auth-google-icon" aria-hidden="true"><svg viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" /><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" /><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" /><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" /></svg></span><span class="auth-google-label">Continue with Google</span><span class="auth-spinner" aria-hidden="true"></span></button>
                    <div class="auth-divider" aria-hidden="true"><span id="authDividerText">or continue with email</span></div>
                    <form class="auth-form" id="authForm" novalidate>
                        <div class="auth-field" id="authNameField" hidden><label for="authName">Full name</label><div class="auth-input-wrap"><input type="text" id="authName" name="name" autocomplete="name" placeholder="Your full name" /></div><p class="auth-field-error" id="authNameError" role="alert" hidden></p></div>
                        <div class="auth-field"><label for="authEmail">Email</label><div class="auth-input-wrap"><svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2" /><line x1="22" y1="6" x2="12" y2="13" /><line x1="2" y1="6" x2="12" y2="13" /></svg><input type="email" id="authEmail" name="email" autocomplete="email" placeholder="Enter your email" required /></div><p class="auth-field-error" id="authEmailError" role="alert" hidden></p></div>
                        <div class="auth-field"><div class="auth-label-row"><label for="authPassword">Password</label><button class="auth-forgot" id="authForgotBtn" type="button">Forgot password?</button></div><div class="auth-input-wrap has-action"><svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg><input type="password" id="authPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required /><button class="auth-eye" id="authEyeBtn" type="button" aria-label="Show password" aria-pressed="false"><svg class="auth-eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg><svg class="auth-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" /></svg></button></div><p class="auth-field-error" id="authPasswordError" role="alert" hidden></p></div>
                        <div class="auth-form-error" id="authFormError" role="alert" hidden><span id="authFormErrorText"></span></div>
                        <button class="auth-submit" id="authSubmitBtn" type="submit"><span class="auth-spinner" aria-hidden="true"></span><span class="auth-submit-label" id="authSubmitLabel">Sign In</span></button>
                    </form>
                    <p class="auth-switch"><span id="authSwitchText">Don't have an account?</span> <button class="auth-link" id="authSwitchBtn" type="button">Sign up</button></p>
                    <p class="auth-terms">By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/supabase/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module">
        import { initAuthModal, openAuthModal, checkOAuthErrorAndShow } from './js/components/auth-modal.js';
        import { loadTheme, toggleTheme, loadSitePalette } from './js/core/theme.js';
        initAuthModal();
        // Close (X) must only dismiss the login view and return to the page
        // the user came from — never Home, never a blank page, no reload.
        // (initAuthModal already hides the modal in place; this only adds
        // the history return so the user lands back on the exact page they
        // were viewing before tapping Account.)
        document.getElementById('authModalClose')?.addEventListener('click', () => {
            let canGoBack = false;
            try {
                canGoBack = window.history.length > 1;
                if (document.referrer) {
                    try { canGoBack = new URL(document.referrer).origin === window.location.origin; }
                    catch (e) { /* keep history-based value */ }
                }
            } catch (e) { canGoBack = false; }
            if (canGoBack) window.history.back();
            // Otherwise (direct visit, no previous page): fall through to the
            // default in-place close — same URL, no navigation, no reload.
        });
        var params = new URLSearchParams(window.location.search);
        var errorNotice = null;
        if (params.has('error_description')) errorNotice = decodeURIComponent(params.get('error_description'));
        else if (params.has('error')) errorNotice = 'Google sign-in failed: ' + decodeURIComponent(params.get('error'));
        if (errorNotice) {
            openAuthModal({ mode: 'signin', notice: errorNotice });
            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, '', window.location.pathname);
            }
        } else {
            checkOAuthErrorAndShow();
            openAuthModal({ mode: 'signin' });
        }
        loadTheme();
        loadSitePalette();
        document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
    </script>
    <script type="module" src="js/components/mobile-nav.js"></script>
    <script type="module" src="js/components/chatbot.js"></script>
    <script type="module" src="js/components/site-init.js"></script>
    <script type="module" src="js/components/demo-contact.js"></script>
</body>
</html>
