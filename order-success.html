<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Order Success — Grabby Tech</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
    (function () {
        try {
            if (localStorage.getItem('grabby_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            var C = null;
            try { C = JSON.parse(localStorage.getItem('grabby_site_colors') || 'null'); } catch (e) {}
            if (C) {
                var props = { bg: '--bg', card: '--card-bg', secondary: '--secondary-bg', text: '--text', textSecondary: '--text-secondary', border: '--border', accent: '--accent', headerBg: '--header-bg', headerText: '--header-text' };
                if (C.preset && C.preset !== 'custom') document.documentElement.setAttribute('data-chrome', C.preset);
                else if (C.colors) for (var k in props) { if (C.colors[k]) document.documentElement.style.setProperty(props[k], C.colors[k]); }
            }
        } catch (e) {}
    })();
    </script>
    <style>
    :root { --bg:#f1f3f5; --text:#181b20; }
    :root[data-theme="dark"] { --bg:#0f1115; --text:#e8eaee; }
    :root[data-chrome="light"] { --bg:#ffffff; --text:#14171c; }
    :root[data-chrome="light"][data-theme="dark"] { --bg:#101014; --text:#eceef1; }
    :root[data-chrome="dark"] { --bg:#0f1115; --text:#e8eaee; }
    html, body { background-color:var(--bg,#0f1115); color:var(--text,#e8eaee); }
    </style>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/components.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/pages.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/responsive.css" media="print" onload="this.media='all'" />
    <noscript>
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/pages.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </noscript>
</head>
<body>

    <header class="header" style="position: relative;">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="Grabby Tech Home">
                <img class="logo-img" src="assets/logos/header logo.png" alt="Grabby Tech" />
            </a>
            <div class="header-actions">
                <button class="icon-btn theme-toggle" id="themeToggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
                <a href="index.html" style="color:var(--header-text); font-weight:500;">Shop</a>
            </div>
        </div>
    </header>

    <main class="success-page">
        <div class="success-container">
            <div class="success-icon">🎉</div>
            <h1 style="font-size:2rem; font-weight:800;">Order Placed!</h1>
            <p style="color:var(--text-secondary); margin-bottom:1rem;">Thank you for your purchase. Your order has been placed successfully.</p>
            <div class="order-number" id="orderNumberDisplay">Order #ORD-123456</div>
            <p style="color:var(--text-secondary); margin-bottom:0.5rem;">We will send you a confirmation email shortly.</p>

            <div class="order-details" id="orderDetails"></div>

            <div class="actions">
                <a href="order-tracking.html?order_id=...">Track Order</a>
                <a href="my-orders.html" class="secondary">My Orders</a>
                <a href="index.html" class="secondary">Continue Shopping</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <img class="logo-img" src="assets/logos/logo.png" alt="Grabby Tech" />
            </div>
            <p class="footer-tagline">Modern gadgets for modern life.</p>
            <div class="footer-links"><a href="about.html">About</a><a href="#">Privacy</a><a href="#">Terms</a></div>
            <div class="footer-copy">© 2026 Grabby Tech</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="js/components/mobile-nav.js"></script>
    <script type="module" src="js/pages/order-success.js"></script>
</body>
</html>
