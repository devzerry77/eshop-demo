<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Activity Logs — E-Shop Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="../css/premium.css"></head>
<body>
<section class="login-overlay" id="loginOverlay"><div class="login-card glass-card">
<div class="brand brand-login"><img class="brand-logo" src="../assets/logo.svg" alt=""><span>E-Shop Admin</span></div>
<form id="loginForm" novalidate><label class="field"><span>Email</span><input type="email" id="loginEmail" required></label>
<label class="field"><span>Password</span><input type="password" id="loginPassword" required></label>
<p class="form-error" id="loginError"></p><p class="rate-limit" id="loginRateLimit">Too many attempts.</p>
<button class="button button-primary button-full" id="loginBtn"><span class="button-label">Sign in</span><span class="button-loader"></span></button></form></div></section>
<div class="admin-layout" id="adminLayout"><div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"><div class="sidebar-top"><button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button><div class="brand"><img class="brand-logo" src="../assets/logo.svg" alt=""><span>E-Shop Demo</span></div><span class="admin-label">ADMIN</span></div>
<nav class="admin-nav"><a href="dashboard.html">⌂ Dashboard</a><a href="products.html">▦ Products</a><a href="orders.html">☰ Orders</a><a href="coupons.html">◈ Coupons</a><a href="inventory.html">⬢ Inventory</a><a href="customers.html">◉ Customers</a><a href="roles.html">⬣ Staff & Roles</a><a href="logs.html" class="active">◷ Activity Logs</a><a href="marketing.html">✦ Marketing & SEO</a><a href="payments.html">◎ Payments</a><a href="settings.html">⚙ Settings</a></nav>
<div class="sidebar-bottom"><button class="sidebar-action" id="logoutBtn">↪ Sign out</button></div></aside>
<main class="admin-main"><header class="admin-header"><div class="header-left"><button class="mobile-toggle" id="adminMobileToggle" aria-label="Open menu" aria-expanded="false">☰</button><h1>Audit & Activity Logs</h1></div>
<div class="header-right"><button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle dark mode"><span class="theme-icon">🌙</span><span class="theme-label">Dark</span></button><select id="logFilter" style="padding:10px;border-radius:12px"><option value="">All actions</option><option value="order.status">Order status</option><option value="inventory.adjust">Inventory</option><option value="coupon">Coupons</option><option value="product">Products</option><option value="settings">Settings</option></select></div></header>
<div class="admin-content"><div class="p-table-wrap"><table class="p-table"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Detail</th></tr></thead>
<tbody id="logRows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div></main></div>
<div id="toastContainer" class="toast-container"></div>
<script src="../js/supabase/supabase-config.js"></script>
    <script src="../js/supabase/local-backend.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/admin-core.js"></script><script src="js/admin-main.js"></script><script src="js/page-logs.js"></script>
</body></html>
